name: Verify Quran App
on:
  push:
    branches: [main, feature/multiuser-auth-foundation]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check src/app.js
          node --check src/account-ui.js
          node --check functions/_lib/account.js
          node --check functions/api/account.js
          node --check functions/api/account/state.js
          node --check src/settings-ui.js
          node --check src/ui-icons.js
          node --check src/simple-flow.js
          node --check src/simple-ui.js
          node --check src/flexible-plan.js
          node --check src/flexible-plan-ui.js
          node --check src/mushaf-core.js
          node --check src/mushaf-ui.js
          node --check src/ayah-test.js
          node --check src/quiz-core.js
      - name: Run tests
        run: npm test
      - name: Validate Cloudflare Pages build
        run: npm run build:pages
